<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2023年度　共創学部 卒業要件チェッカー</title>
<link rel="stylesheet" href="style.css">
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-RXFDSEP7MD"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-RXFDSEP7MD');
</script>
</head>
<body>
<header>
  <h1>2023年度　共創学部 卒業要件チェッカー</h1>
</header>

<main>
  <section class="card" id="howto">
    <h2>使い方（PCのみ）</h2>
    <ol class="steps">
      <li><strong>成績照会</strong>（Campusmate）ページを開く</li>
      <li><strong>Ctrl+S</strong>（Mac は <strong>Cmd+S</strong>）で「Webページ、完全」として保存</li>
      <li>保存した <strong>.html ファイル</strong>を下の欄にドラッグ&amp;ドロップ / ファイル選択</li>
    </ol>
    <figure>
      <img src="assets/howto-save.png" alt="成績照会ページで Ctrl+S / Cmd+S を押して保存する手順">
    </figure>
  </section>

  <section class="card" id="upload">
    <h2>1. 成績HTMLを読み込む</h2>
    <div id="dropzone" tabindex="0">
      <p class="dz-main">ここに .html ファイルをドラッグ&amp;ドロップ</p>
      <p class="dz-sub">または <button type="button" id="pickBtn">ファイルを選択</button></p>
      <input type="file" id="fileInput" accept=".html,.htm" hidden>
    <div class="row">
      <button type="button" id="clearBtn">クリア</button>
    </div>
    <p id="parseError" class="error" hidden></p>
  </section>

  <section class="card" id="result" hidden>
    <h2>2. 判定結果</h2>
    <div id="summary"></div>
    <div id="missing"></div>
    <div id="progress"></div>
    <div id="others"></div>
    <div id="courses"></div>
    <div id="excluded"></div>
  </section>
</main>

<script type="module" src="src/app.js"></script>
</body>
</html>
